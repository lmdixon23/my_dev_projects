[package]
name = "rust_decentralized_voting"
version = "0.2.0"
edition = "2021"
description = "Commit-reveal voting protocol with SHA-256 ballot commitments and a Merkle-rooted tally. Single-process simulation; not a real blockchain client."
license = "MIT"

[dependencies]
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "1.0"

[lib]
name = "rust_decentralized_voting"
path = "src/lib.rs"

[[bin]]
name = "rust_decentralized_voting"
path = "src/main.rs"
