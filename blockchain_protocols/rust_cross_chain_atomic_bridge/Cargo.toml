[package]
name = "rust_cross_chain_atomic_bridge"
version = "0.2.0"
edition = "2021"
description = "Simulation of an HTLC-based atomic-swap bridge between in-process chains. Not a real on-chain bridge."
license = "MIT"

[dependencies]
tokio = { version = "=1.38", features = ["rt-multi-thread", "macros", "sync", "time"] }
log = "=0.4.22"
env_logger = "=0.11.5"
sha2 = "=0.10.8"
subtle = "=2.5.0"
thiserror = "=1.0.63"
uuid = { version = "=1.10.0", features = ["v4"] }
hex = "=0.4.3"
getrandom = "=0.2.15"
