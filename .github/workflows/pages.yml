name: Deploy AI Playgrounds

# Publishes the ai_playgrounds/ directory to GitHub Pages.
# Site root = ai_playgrounds/index.html  ->  https://lmdixon23.github.io/my_dev_projects/
on:
  push:
    branches: [main]
    paths:
      - 'ai_playgrounds/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least-privilege token scoped for the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on via the API on the first run, so no manual
          # Settings -> Pages click is needed. (Requires repo Actions to be
          # permitted to enable Pages; otherwise enable it once by hand.)
          enablement: true
      - name: Upload ai_playgrounds as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai_playgrounds
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
